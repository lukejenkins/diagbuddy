[package]
name = "diagbuddy"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Companion daemon that streams DIAG frames from OpenWrt cellular routers to rayhunter"
publish = false

[dependencies]
dcicore = { path = "../dcicore" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
